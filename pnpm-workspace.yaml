# Fail fast when the local Node version does not match engines.node.
engineStrict: true

allowBuilds:
  nx: true
  sharp: false
  unrs-resolver: false
  '@swc/core': false
  esbuild: false
  '@parcel/watcher': false
  '@nestjs/core': false
  # Pulled in by testcontainers: native SSH speed-ups and a version notice, not needed for a local Docker socket.
  cpu-features: false
  ssh2: false
  protobufjs: false
