name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas looks up the last successful run on main to use as base.
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # nx affected needs the full history to compare against main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The importer is Python; uv reads .python-version and installs Python 3.14 itself.
      - uses: astral-sh/setup-uv@v10
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: apps/importer/uv.lock
          # The runner only ships Python 3.12, so keep the downloaded 3.14 between runs.
          cache-python: true

      - uses: nrwl/nx-set-shas@v5

      # --all because without it Nx only checks changed files and misses drift elsewhere.
      - run: pnpm nx format:check --all

      - if: github.event_name != 'workflow_dispatch'
        run: pnpm nx affected -t lint typecheck test build

      # affected finds nothing when no project changed since the base (e.g. the very first run),
      # so a manual run checks the whole workspace to prove it is green.
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm nx run-many -t lint typecheck test build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Secrets can hide in any commit of the branch, not only the last one.
          fetch-depth: 0

      # No license key needed: the repo belongs to a personal account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need write access; the failed check is signal enough.
          GITLEAKS_ENABLE_COMMENTS: false

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local hooks can be skipped with --no-verify, so CI checks every commit of the PR again.
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec likec4 validate docs/architecture

      # Files and rules come from .markdownlint-cli2.jsonc.
      - run: pnpm exec markdownlint-cli2
