services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Only reachable from this machine, not from the local network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Since PostgreSQL 18 the image keeps its data below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # A one-off job, not a server: start it with `docker compose run --rm importer`.
  importer:
    build: apps/importer
    # Without a profile `docker compose up` would start the import every time.
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Inside the Compose network the database is the service "db" on its container
      # port, not localhost and not the port published to the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'

volumes:
  db-data:
