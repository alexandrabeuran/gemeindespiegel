[project]
name = "importer"
version = "0.1.0"
description = "Imports Swiss municipalities (BFS) and electricity prices (ElCom) into PostgreSQL"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
importer = "importer:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Beyond the defaults (E, F): import order, bugbear, modern syntax, naming, simplifications.
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
# Fail on unknown markers and config keys instead of silently ignoring typos.
strict = true
