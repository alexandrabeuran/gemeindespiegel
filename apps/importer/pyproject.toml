[project]
name = "importer"
version = "0.1.0"
description = "Imports Swiss municipalities (BFS) and electricity prices (ElCom) into PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
]

[project.scripts]
importer = "importer:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Beyond the defaults (E, F): import order, bugbear, modern syntax, naming, simplifications.
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Parsed source data must leave the parsers fully typed. Tests are exempt: they
# edit JSON documents freely to build broken responses.
[[tool.mypy.overrides]]
module = ["importer", "importer.*"]
disallow_any_expr = true

[tool.pytest]
testpaths = ["tests"]
# Fail on unknown markers and config keys instead of silently ignoring typos.
strict = true
markers = ["integration: needs Docker (Testcontainers), run with nx run importer:test-integration"]
# Plain pytest (and nx test) must work without Docker; a later -m on the command line wins.
addopts = ["-m", "not integration"]
